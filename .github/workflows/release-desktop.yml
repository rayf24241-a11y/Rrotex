name: Release ROTEX Desktop

# Run this manually from GitHub → Actions → "Release ROTEX Desktop" → Run workflow.
# Enter the new version (e.g. 2.1.0) and it builds all platforms, publishes the
# GitHub Release, and generates the latest.yml files that electron-updater uses
# to deliver in-app updates to existing installs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Bump version in electron/package.json and commit/tag it ─────────────────
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in electron/package.json
        run: |
          cd electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${{ github.event.inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json
          git commit -m "chore: release v${{ github.event.inputs.version }}"
          git push

      - name: Create and push tag
        id: tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # ── Build Windows ────────────────────────────────────────────────────────────
  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: electron

      - name: Build and publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish always
        working-directory: electron

  # ── Build Linux ──────────────────────────────────────────────────────────────
  build-linux:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: electron

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build and publish Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always
        working-directory: electron

  # ── Build macOS ──────────────────────────────────────────────────────────────
  build-mac:
    needs: bump-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: electron

      - name: Build and publish macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish always
        working-directory: electron

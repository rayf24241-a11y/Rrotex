name: Build ROTEX Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "editor.html"
      - "editor.css"
      - "editor.js"
      - "login.html"
      - "projects.html"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
        working-directory: electron
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            downloads/desktop/ROTEX-Desktop-win.exe
            downloads/desktop/ROTEX-Desktop-win.exe.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Build Linux
        run: npm run build:linux
        working-directory: electron
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            downloads/desktop/ROTEX-Desktop-linux.AppImage
            downloads/desktop/ROTEX-Desktop-linux.deb
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Build macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac
        working-directory: electron
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            downloads/desktop/ROTEX-Desktop-mac.dmg
            downloads/desktop/ROTEX-Desktop-mac.zip
            downloads/desktop/ROTEX-Desktop-mac.dmg.blockmap
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: ROTEX Desktop - Latest Build
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/ROTEX-Desktop-win.exe
            artifacts/ROTEX-Desktop-linux.AppImage
            artifacts/ROTEX-Desktop-mac.dmg

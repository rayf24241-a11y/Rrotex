name: Build ROTEX Desktop (CI)

# CI only — verifies the build compiles. Does NOT publish or create a release.
# To release, run the "Release ROTEX Desktop" workflow manually.

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "editor.html"
      - "editor.css"
      - "editor.js"
      - "login.html"
      - "projects.html"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Build Windows (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
        working-directory: electron
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            downloads/desktop/ROTEX-Desktop-win.exe
            downloads/desktop/ROTEX-Desktop-win.exe.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build Linux (no publish)
        run: npm run build:linux
        working-directory: electron
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            downloads/desktop/ROTEX-Desktop-linux.AppImage
            downloads/desktop/ROTEX-Desktop-linux.deb
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: electron
      - name: Build macOS (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac
        working-directory: electron
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            downloads/desktop/ROTEX-Desktop-mac.dmg
            downloads/desktop/ROTEX-Desktop-mac.zip
            downloads/desktop/ROTEX-Desktop-mac.dmg.blockmap
          if-no-files-found: error

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROTEX</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Saved chats">
        <a class="brand" href="#" aria-label="ROTEX home">
          <span class="brand-mark">R</span>
          <span>ROTEX</span>
        </a>

        <button class="new-chat" id="newChatButton" type="button">New chat</button>

        <div class="sidebar-label">Chats</div>
        <div class="chat-list" id="chatList"></div>

        <div class="account-panel">
          <button class="google-button" id="googleButton" type="button">
            <span class="google-mark">G</span>
            <span id="googleButtonText">Log in or sign up</span>
          </button>
          <button class="signout-button" id="signOutButton" type="button" hidden>Sign out</button>
          <p id="saveStatus">Chats save on this device until Firebase is configured.</p>
        </div>
      </aside>

      <section class="chat-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">ROTEX web</p>
            <h1>Chat with ROTEX</h1>
          </div>
          <div class="top-actions">
            <div class="credit-pill" id="creditStatus">$0.003 credits</div>
            <div class="status-pill" id="syncStatus">Local mode</div>
          </div>
        </header>

        <section class="messages" id="messages" aria-live="polite"></section>

        <form class="composer" id="composer">
          <div class="model-select-wrap">
            <button class="model-select" id="modelButton" type="button" aria-expanded="false">
              <span id="selectedModelName">Rod _ 1</span>
              <small id="selectedModelShort">Everyday</small>
            </button>
            <div class="model-menu" id="modelMenu" aria-hidden="true"></div>
          </div>
          <textarea id="messageInput" rows="1" placeholder="Message ROTEX..."></textarea>
          <button class="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>

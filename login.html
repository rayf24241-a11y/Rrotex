<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROTEX — Sign In</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <script src="./dev-guard.js"></script>
  <style>
    :root {
      --bg:        #0D0F17;
      --surface:   #141720;
      --panel:     #1A1F2E;
      --border:    #252D40;
      --text:      #E8EDF8;
      --muted:     #8A93AA;
      --quiet:     #525C78;
      --accent:    #4B9DFF;
      --accent-d:  rgba(75,157,255,0.15);
      --accent-g:  rgba(75,157,255,0.30);
      --red:       #FF4757;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* Background layers */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 700px 500px at 15% -100px, rgba(75,157,255,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 600px 500px at 85% 110%,  rgba(75,157,255,0.08)  0%, transparent 60%);
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
      mask-image:         radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
    }

    /* Layout */
    .wrap {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px 24px;
      gap: 28px;
    }

    /* Logo */
    .logo {
      display: flex; align-items: center; gap: 14px;
      -webkit-app-region: no-drag;
    }
    .logo-mark {
      width: 54px; height: 54px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 44px var(--accent-g), 0 8px 24px rgba(0,0,0,0.45);
    }
    .logo-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-name {
      font-size: 28px; font-weight: 800; letter-spacing: 0.07em; color: var(--text);
    }
    .logo-tag {
      font-size: 11px; color: var(--quiet); letter-spacing: 0.14em;
      text-transform: uppercase; margin-top: 3px;
    }

    /* Card */
    .card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 32px 96px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      -webkit-app-region: no-drag;
    }

    /* Tab switcher */
    .tabs {
      display: flex; gap: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 4px;
      margin-bottom: 26px;
    }
    .tab {
      flex: 1; padding: 9px; border-radius: 8px;
      font: 600 13px/1 inherit; color: var(--muted);
      background: none; border: none; cursor: pointer;
      transition: all 0.14s;
    }
    .tab.on {
      background: var(--surface); color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    /* Fields */
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .field input {
      width: 100%;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font: inherit; font-size: 14px; padding: 11px 14px;
      outline: none; transition: border-color 0.14s, box-shadow 0.14s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-d); }
    .field input::placeholder { color: var(--quiet); }

    /* Primary button */
    .btn-primary {
      width: 100%; margin-top: 18px;
      padding: 13px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 11px;
      font: 700 14px/1 inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.14s;
      box-shadow: 0 4px 18px var(--accent-d);
    }
    .btn-primary:hover { background: #6AACFF; box-shadow: 0 4px 28px var(--accent-g); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0; color: var(--quiet); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Google button */
    .btn-google {
      width: 100%; padding: 12px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 11px;
      font: 600 13px/1 inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.14s;
    }
    .btn-google:hover { background: var(--surface); border-color: #364460; }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* Error */
    .error {
      margin-top: 14px; padding: 10px 13px;
      background: rgba(255,71,87,0.09); border: 1px solid rgba(255,71,87,0.28);
      border-radius: 9px; color: var(--red); font-size: 12px; line-height: 1.45;
      display: none;
    }
    .error.show { display: block; }

    /* Spinner */
    .spin {
      width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer { font-size: 11px; color: var(--quiet); -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="wrap">
    <div class="logo">
      <div class="logo-mark"><img src="./icon.png" alt="ROTEX"></div>
      <div>
        <div class="logo-name">ROTEX</div>
        <div class="logo-tag">AI Assistant</div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab on" id="tabIn"  onclick="switchTab('in')">Sign In</button>
        <button class="tab"    id="tabUp"  onclick="switchTab('up')">Create Account</button>
      </div>

      <!-- Sign In -->
      <div id="viewIn">
        <div class="field">
          <label>Email</label>
          <input type="email" id="inEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="inPass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="inBtn"><span>Sign In</span></button>
      </div>

      <!-- Sign Up -->
      <div id="viewUp" style="display:none">
        <div class="field">
          <label>Display Name</label>
          <input type="text" id="upName" placeholder="Your name" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="upEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="upPass" placeholder="Min. 6 characters" autocomplete="new-password">
        </div>
        <button class="btn-primary" id="upBtn"><span>Create Account</span></button>
      </div>

      <div class="divider">or</div>

      <button class="btn-google" id="gBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="error" id="errBox"></div>
    </div>

    <div class="footer">ROTEX v16.0.00</div>
  </div>

  <script src="./desktop-auth.js"></script>
  <script type="module">
    import { initializeApp }            from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import {
      getAuth, onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup, GoogleAuthProvider,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

    let auth = null;
    const isDesktopLogin = new URLSearchParams(window.location.search).has('desktop');

    /* ══════════════════════════════════════════════════════════════════
       DESKTOP APP PATH — skip Firebase entirely, open browser to sign in
       ══════════════════════════════════════════════════════════════════ */
    if (window.rotexDesktop?.isDesktop) {
      (async () => {
        try {
          localStorage.removeItem('rotex_desktop_auth');
          localStorage.removeItem('rotex_desktop_auth_mirror');
          await window.rotexDesktop?.clearDesktopAuth?.();
        } catch {}

      // Replace card with desktop sign-in UI
      document.querySelector('.card').innerHTML = `
        <div style="text-align:center;padding:8px 0;">
          <div style="font-size:17px;font-weight:700;margin-bottom:10px;color:var(--text)">Sign in to ROTEX</div>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px;">
            Your browser will open rrotex.com so you can sign in securely.
            The app will connect automatically when done.
          </p>
          <button class="btn-primary" id="openBrowserBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open rrotex.com to sign in
          </button>
          <div id="waitingState" style="display:none;margin-top:20px;">
            <div style="display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;">
              <div class="spin" style="border-top-color:var(--yellow);border-color:var(--border);"></div>
              Waiting for sign-in on rrotex.com…
            </div>
            <button style="margin-top:14px;background:none;border:none;color:var(--quiet);font-size:12px;cursor:pointer;text-decoration:underline;" onclick="resetDesktopLogin()">
              Try again
            </button>
          </div>
          <div class="error" id="errBox" style="margin-top:14px;"></div>
        </div>
      `;

      async function openDesktopBrowserLogin() {
        try {
          const btn = document.getElementById('openBrowserBtn');
          const waiting = document.getElementById('waitingState');
          if (btn) btn.style.display = 'none';
          if (waiting) waiting.style.display = 'block';
          const port = await window.rotexDesktop.startAuthServer();
          await window.rotexDesktop.openExternal(`https://www.rrotex.com/login?desktop=1&callback=${port}`);
        } catch {
          const btn = document.getElementById('openBrowserBtn');
          const waiting = document.getElementById('waitingState');
          const err = document.getElementById('errBox');
          if (btn) btn.style.display = 'flex';
          if (waiting) waiting.style.display = 'none';
          if (err) {
            err.textContent = 'Could not open the browser automatically. Click the button to try again.';
            err.classList.add('show');
          }
        }
      }

      document.getElementById('openBrowserBtn').onclick = openDesktopBrowserLogin;

      setTimeout(() => {
        openDesktopBrowserLogin();
      }, 350);

      window.resetDesktopLogin = () => {
        document.getElementById('openBrowserBtn').style.display = 'flex';
        document.getElementById('waitingState').style.display = 'none';
      };

      // Listen for deep link auth-callback from main.js
      window.rotexDesktop.onAuthCallback(data => {
        if (!data?.uid) return;
        const authData = window.rotexDesktopAuth?.persist({
          uid:   data.uid,
          email: data.email  || '',
          name:  data.name   || '',
          exp:   data.exp    || String(Date.now() + 365 * 24 * 60 * 60 * 1000),
          token: data.token  || '',
          refreshToken: data.refreshToken || '',
        }) || {
          uid: data.uid,
          email: data.email || '',
          name: data.name || '',
          exp: data.exp || String(Date.now() + 365 * 24 * 60 * 60 * 1000),
          token: data.token || '',
          refreshToken: data.refreshToken || '',
        };
        localStorage.setItem('rotex_desktop_auth', JSON.stringify(authData));
        window.rotexDesktop.navigate('projects');
      });
      })();

    } else {
    /* ══════════════════════════════════════════════════════════════════
       WEB / NORMAL PATH — Firebase auth as usual
       ══════════════════════════════════════════════════════════════════ */

    /* ── Bootstrap Firebase ─────────────────────────────────────────── */
    async function boot() {
      try {
        const res  = await fetch('/api/firebase-config');
        const data = await res.json();
        if (!data.configured) { fallback(); return; }

        const app = initializeApp(data.firebaseConfig);
        auth = getAuth(app);

        onAuthStateChanged(auth, user => {
          if (!user) return;
          if (isDesktopLogin) showDesktopConnect(user);
          else go(user);
        });
      } catch { fallback(); }
    }

    function fallback() {
      try {
        const s = JSON.parse(localStorage.getItem('rotex_desktop_auth') || 'null');
        if (s?.uid && Number(s.exp) > Date.now()) navigate();
      } catch {}
    }

    /* ── Navigation ─────────────────────────────────────────────────── */
    function navigate(page = 'projects') {
      if (window.rotexDesktop) window.rotexDesktop.navigate(page);
      else window.location.href = `/${page}`;
    }

    async function go(user) {
      const token    = await user.getIdToken().catch(() => '');
      const refreshToken = user?.stsTokenManager?.refreshToken || user?.refreshToken || '';
      const authLifetimeDays = isDesktopLogin ? 365 : 7;
      const authData = {
        uid:   user.uid,
        email: user.email        || '',
        name:  user.displayName  || '',
        exp:   String(Date.now() + authLifetimeDays * 24 * 60 * 60 * 1000),
        token,
        refreshToken
      };
      localStorage.setItem('rotex_desktop_auth', JSON.stringify(authData));

      // If this is a desktop-initiated login, POST auth data to the local callback server
      if (isDesktopLogin) {
        document.querySelector('.card').innerHTML = `
          <div style="text-align:center;padding:16px 0;">
            <div id="desktopCallbackTitle" style="font-size:17px;font-weight:700;margin-bottom:10px;color:var(--text)">Signing in...</div>
            <p style="color:var(--muted);font-size:13px;line-height:1.6;">
              Connecting to ROTEX Desktop…
            </p>
          </div>
        `;
        const callbackPort = new URLSearchParams(window.location.search).get('callback');
        const deepLink = `rotex://auth?${new URLSearchParams(authData).toString()}`;
        if (callbackPort) {
          try {
            const callbackRes = await fetch(`http://127.0.0.1:${callbackPort}/auth`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(authData),
            });
            if (!callbackRes.ok) throw new Error('Desktop callback failed');
            document.getElementById('desktopCallbackTitle').textContent = 'Connected to ROTEX Desktop';
            document.querySelector('.card p').textContent = 'The app should open your projects now. You can close this tab.';
            return;
          } catch {
            window.location.href = deepLink;
            document.getElementById('desktopCallbackTitle').textContent = 'Signed in. Return to ROTEX Desktop.';
            document.querySelector('.card p').textContent = 'If your browser asks, allow it to open ROTEX Desktop.';
            return;
          }
        }
        window.location.href = deepLink;
        document.getElementById('desktopCallbackTitle').textContent = 'Signed in!';
        document.querySelector('.card p').textContent = 'You can close this tab and return to ROTEX Desktop.';
        return;
      }

      navigate('projects');
    }

    function showDesktopConnect(user) {
      const email = user.email || 'your account';
      document.querySelector('.card').innerHTML = `
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:17px;font-weight:700;margin-bottom:10px;color:var(--text)">Connect ROTEX Desktop</div>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:18px;">
            You are signed in on rrotex.com as <strong style="color:var(--text)">${email}</strong>.
            Click below to connect this browser session to the desktop app.
          </p>
          <button class="btn-primary" id="connectDesktopBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            Connect to ROTEX Desktop
          </button>
          <div class="error" id="errBox" style="margin-top:14px;"></div>
        </div>
      `;
      document.getElementById('connectDesktopBtn').onclick = () => go(user);
    }

    /* ── UI helpers ─────────────────────────────────────────────────── */
    function err(msg) {
      const el = document.getElementById('errBox');
      el.textContent = msg; el.classList.add('show');
    }
    function clearErr() { document.getElementById('errBox').classList.remove('show'); }

    function busy(id, loading, label) {
      const b = document.getElementById(id);
      b.disabled = loading;
      b.innerHTML = loading ? '<div class="spin"></div>' : `<span>${label}</span>`;
    }

    /* ── Tab switch ─────────────────────────────────────────────────── */
    window.switchTab = t => {
      clearErr();
      const isIn = t === 'in';
      document.getElementById('tabIn').classList.toggle('on', isIn);
      document.getElementById('tabUp').classList.toggle('on', !isIn);
      document.getElementById('viewIn').style.display = isIn ? 'block' : 'none';
      document.getElementById('viewUp').style.display = isIn ? 'none'  : 'block';
    };

    /* ── Sign In ────────────────────────────────────────────────────── */
    document.getElementById('inBtn').onclick = async () => {
      if (!auth) return err('Firebase not set up. Please contact support.');
      const email = document.getElementById('inEmail').value.trim();
      const pass  = document.getElementById('inPass').value;
      if (!email || !pass) return err('Please fill in all fields.');
      clearErr(); busy('inBtn', true, '');
      try {
        const r = await signInWithEmailAndPassword(auth, email, pass);
        await go(r.user);
      } catch (e) {
        busy('inBtn', false, 'Sign In');
        err({ 'auth/invalid-credential': 'Incorrect email or password.',
               'auth/user-not-found':     'No account with that email.',
               'auth/wrong-password':     'Incorrect password.',
               'auth/too-many-requests':  'Too many attempts — try later.' }[e.code]
            || 'Sign in failed. Please try again.');
      }
    };

    /* ── Sign Up ────────────────────────────────────────────────────── */
    document.getElementById('upBtn').onclick = async () => {
      if (!auth) return err('Firebase not set up. Please contact support.');
      const name  = document.getElementById('upName').value.trim();
      const email = document.getElementById('upEmail').value.trim();
      const pass  = document.getElementById('upPass').value;
      if (!name || !email || !pass) return err('Please fill in all fields.');
      if (pass.length < 6) return err('Password must be at least 6 characters.');
      clearErr(); busy('upBtn', true, '');
      try {
        const r = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(r.user, { displayName: name });
        await go(r.user);
      } catch (e) {
        busy('upBtn', false, 'Create Account');
        err({ 'auth/email-already-in-use': 'That email is already registered.',
               'auth/invalid-email':       'Invalid email address.',
               'auth/weak-password':       'Password is too weak.' }[e.code]
            || 'Sign up failed. Please try again.');
      }
    };

    /* ── Google ─────────────────────────────────────────────────────── */
    document.getElementById('gBtn').onclick = async () => {
      if (!auth) return err('Firebase not set up. Please contact support.');
      clearErr();
      document.getElementById('gBtn').disabled = true;
      try {
        const provider = new GoogleAuthProvider();
        const r = await signInWithPopup(auth, provider);
        await go(r.user);
      } catch (e) {
        document.getElementById('gBtn').disabled = false;
        if (e.code !== 'auth/popup-closed-by-user') err('Google sign-in failed. Try again.');
      }
    };

    /* ── Enter key ──────────────────────────────────────────────────── */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const isIn = document.getElementById('viewIn').style.display !== 'none';
      document.getElementById(isIn ? 'inBtn' : 'upBtn').click();
    });

    boot();
    } // end else (web path)
  </script>
</body>
</html>
